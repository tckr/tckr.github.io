    // Apply a saved light/dark choice before the first paint; with none saved, the system setting decides.
    try {

      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}

  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fb;
      --fg: #1d1f2b; --muted: #5a5f78;
      --dot: rgba(52, 66, 120, 0.15);
      /* Tuned in the Paper Gradient Lab: a blue glow in the bottom right, a trace of purple on the left and of grey along the top. */
      --glow:
        radial-gradient(ellipse 75% 75% at 88% 86%, rgba(127, 168, 245, 0.125) 0%, rgba(127, 168, 245, 0.105) 25%, rgba(127, 168, 245, 0.062) 50%, rgba(127, 168, 245, 0.02) 75%, rgba(127, 168, 245, 0) 100%),
        radial-gradient(ellipse 60% 60% at 8% 62%, rgba(166, 139, 232, 0.05) 0%, rgba(166, 139, 232, 0.042) 25%, rgba(166, 139, 232, 0.025) 50%, rgba(166, 139, 232, 0.008) 75%, rgba(166, 139, 232, 0) 100%),
        radial-gradient(ellipse 70% 70% at 62% -5%, rgba(154, 163, 184, 0.05) 0%, rgba(154, 163, 184, 0.042) 25%, rgba(154, 163, 184, 0.025) 50%, rgba(154, 163, 184, 0.008) 75%, rgba(154, 163, 184, 0) 100%);
      --hover: rgba(40, 50, 95, 0.07);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #14161f;
        --fg: #e8eaf2; --muted: #9aa1b8;
        --dot: rgba(160, 176, 230, 0.17);
        --glow:
        radial-gradient(ellipse 75% 75% at 88% 86%, rgba(127, 168, 245, 0.056) 0%, rgba(127, 168, 245, 0.047) 25%, rgba(127, 168, 245, 0.028) 50%, rgba(127, 168, 245, 0.009) 75%, rgba(127, 168, 245, 0) 100%),
        radial-gradient(ellipse 60% 60% at 8% 62%, rgba(166, 139, 232, 0.023) 0%, rgba(166, 139, 232, 0.019) 25%, rgba(166, 139, 232, 0.011) 50%, rgba(166, 139, 232, 0.004) 75%, rgba(166, 139, 232, 0) 100%),
        radial-gradient(ellipse 70% 70% at 62% -5%, rgba(154, 163, 184, 0.023) 0%, rgba(154, 163, 184, 0.019) 25%, rgba(154, 163, 184, 0.011) 50%, rgba(154, 163, 184, 0.004) 75%, rgba(154, 163, 184, 0) 100%);
        --hover: rgba(255, 255, 255, 0.07);
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #14161f;
      --fg: #e8eaf2; --muted: #9aa1b8;
      --dot: rgba(160, 176, 230, 0.17);
      --glow:
        radial-gradient(ellipse 75% 75% at 88% 86%, rgba(127, 168, 245, 0.056) 0%, rgba(127, 168, 245, 0.047) 25%, rgba(127, 168, 245, 0.028) 50%, rgba(127, 168, 245, 0.009) 75%, rgba(127, 168, 245, 0) 100%),
        radial-gradient(ellipse 60% 60% at 8% 62%, rgba(166, 139, 232, 0.023) 0%, rgba(166, 139, 232, 0.019) 25%, rgba(166, 139, 232, 0.011) 50%, rgba(166, 139, 232, 0.004) 75%, rgba(166, 139, 232, 0) 100%),
        radial-gradient(ellipse 70% 70% at 62% -5%, rgba(154, 163, 184, 0.023) 0%, rgba(154, 163, 184, 0.019) 25%, rgba(154, 163, 184, 0.011) 50%, rgba(154, 163, 184, 0.004) 75%, rgba(154, 163, 184, 0) 100%);
      --hover: rgba(255, 255, 255, 0.07);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
      /* Paper with soft glows of blue, purple and grey laid over it. */
      background: var(--glow), var(--bg);
      background-attachment: fixed;
      color: var(--fg);
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      -webkit-font-smoothing: antialiased;
      touch-action: pinch-zoom;  /* a finger drag draws instead of scrolling */
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #paper {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    /* The name sits in the centre of the page; scenes are drawn in tiles around and behind it. */
    main {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: max-content;
      max-width: calc(100% - 48px);
      text-align: center;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
    }
    main[hidden] { display: none; }
    main a { pointer-events: auto; }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.5rem, 5.6vw, 2.75rem);
      font-weight: 500;
    }
    a {
      color: var(--muted);
      font-size: 1rem;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
      transition: color 120ms ease;
    }
    a:hover, a:focus-visible { color: var(--fg); }
    a:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; border-radius: 2px; }
    .tools {
      position: fixed;
      right: max(12px, env(safe-area-inset-right, 0px));
      top: max(12px, env(safe-area-inset-top, 0px));   /* clear of the mountains along the bottom */
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      align-items: center;
      gap: 4px;
      max-width: calc(100% - 24px);
      background: var(--bg);   /* stays readable when a pattern covers the paper */
      border-radius: 8px;
    }
    /* Only Reset and the three dots show until the dots are pressed; then the rest unfold beside them. */
    .more { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 4px; }
    .more[hidden] { display: none; }
    .tools .icon { display: inline-flex; align-items: center; padding: 8px; }
    .tools svg { display: block; pointer-events: none; }
    #menu .close, #menu[aria-expanded="true"] .dots { display: none; }
    #menu[aria-expanded="true"] .close { display: block; }
    .tools button {
      font: inherit;
      font-size: 0.8125rem;
      color: var(--muted);
      background: none;
      border: 0;
      border-radius: 4px;
      padding: 8px 10px;
      cursor: pointer;
      transition: color 120ms ease;
    }
    .tools button:hover, .tools button:focus-visible { color: var(--fg); }
    .tools button:focus-visible { outline: 2px solid currentColor; outline-offset: -2px; }
    .tools button:disabled { opacity: 0.45; cursor: default; color: var(--muted); }

<body>
  <canvas id="paper" aria-hidden="true"></canvas>
  <main>

  <div class="tools">
    <div class="more" id="more" hidden>

      <button type="button" id="name" aria-pressed="true">Name: on</button>

    </button>
    <button type="button" class="icon" id="menu" aria-label="Show all buttons" title="More" aria-expanded="false" aria-controls="more">
      <svg class="dots" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true"><circle cx="3" cy="8" r="1.4"/><circle cx="8" cy="8" r="1.4"/><circle cx="13" cy="8" r="1.4"/></svg>
      <svg class="close" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5L10.5 8 6 12.5"/></svg>
    </button>

  <script>
  (() => {
    const canvas = document.getElementById('paper');
    const ctx = canvas.getContext('2d');
    if (!ctx) return;

    // Dot grid paper. Click a square to colour it, or drag to colour a run; each further click moves it to
    // the next colour in the sequence, and after the last one it goes back to blank.
    let SIZE = 18;     // px per square; smaller on narrow screens
    let GAP = 2;       // px of paper left around a coloured square
    const COLORS = ['#6a94e6', '#7cc4ee', '#5b62c9', '#9d82dc', '#cf8fcb', '#a3a9bb', '#565d7e', '#74a88f', '#e0b964'];
    //              blue       sky        indigo     purple     mauve      grey       slate      sage       gold
    const STORE = 'paper-v5';

    // Squares are counted from the centre of the window, so a drawing stays put
    // around the name when the window is resized. Key "col,row" -> index into COLORS.
    // The paper starts blank. "Random" draws a scene on it, taking turns between kinds
    // and different each time: a mountain landscape along the bottom of the window (a
    // sun, three ranges from far to near, green foothills), then three tiled floors:
    // chevron, basketweave and stepped diamonds; then a map of the world.
    // A scene is worked out from a seed and the window's size, so it always fills the
    // window and survives a resize.
    const BLUE = 0, SKY = 1, INDIGO = 2, PURPLE = 3, GREY = 5, SLATE = 6, SAGE = 7, GOLD = 8;
    const RANGES = [
      // colour, floor height, snow?, peaks as [across 0..1, height, left steepness, right steepness]
      { c: GREY,   floor: 0.10, snow: true,  peaks: [[0.10, 0.24, 1.3, 0.8], [0.31, 0.36, 1.0, 1.4], [0.53, 0.29, 0.9, 1.1], [0.77, 0.40, 1.5, 1.0], [0.96, 0.25, 1.0, 1.2]] },
      { c: PURPLE, floor: 0.08, snow: false, peaks: [[0.02, 0.19, 0.8, 0.7], [0.22, 0.23, 0.8, 1.0], [0.44, 0.19, 0.6, 0.8], [0.65, 0.25, 1.0, 0.7], [0.89, 0.21, 0.7, 0.9]] },
      { c: BLUE,   floor: 0.06, snow: false, peaks: [[0.14, 0.12, 0.5, 0.6], [0.39, 0.15, 0.6, 0.5], [0.61, 0.11, 0.5, 0.5], [0.85, 0.15, 0.5, 0.6]] },
    ];
    // Height of one range at column i: the tallest of its peaks there, each with its own
    // slope on either side. Slopes get rougher away from a summit, so summits stay sharp.
    // A small seeded random number generator, so one seed always gives the same scene.
    const rng = (seed) => () => {
      seed = (seed + 0x6D2B79F5) | 0;
      let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
    // Height of one range at column i: the tallest of its peaks there, each with its own
    // slope on either side. Slopes get rougher away from a summit, so summits stay sharp.
    function ridge(range, i, cols, unit) {
      let h = range.floor * unit, top = 0, away = 99;
      for (const [across, height, left, right] of range.peaks) {
        const dx = i + 0.5 - across * cols;
        const v = height * unit - (dx < 0 ? -dx * left : dx * right);
        if (v > h) { h = v; top = height * unit; away = Math.abs(dx); }
      }
      const rough = Math.sin(i * 1.7 + range.phase) * 0.5 + Math.sin(i * 0.53 + range.phase * 0.6) * 0.8;
      return { h: h + rough * Math.min(1, away / 5), top };
    }
    function landscape(seed) {
      const rand = rng(seed);
      const vary = (v, by) => v * (1 - by + rand() * by * 2);
      // Each scene nudges every peak sideways, taller or shorter, and steeper or gentler.
      const ranges = RANGES.map((range) => ({
        ...range,
        phase: rand() * 6.28,
        peaks: range.peaks.map(([across, height, left, right]) =>
          [across + (rand() - 0.5) * 0.12, vary(height, 0.22), vary(left, 0.25), vary(right, 0.25)]),
      }));
      const sunAcross = 0.18 + rand() * 0.64, hillA = rand() * 6.28, hillB = rand() * 6.28;

      const c0 = Math.floor(-(vw / 2) / SIZE), c1 = Math.ceil((vw / 2) / SIZE) - 1;
      const bottom = Math.ceil((vh / 2) / SIZE) - 1;          // lowest row on screen
      const cols = c1 - c0 + 1, rows = Math.ceil(vh / SIZE);
      // The columns the name stands over, and how many rows are free beneath it.
      const nameEl = document.querySelector('main');
      const box = nameEl.getBoundingClientRect();
      const n0 = Math.floor((box.left - vw / 2) / SIZE) - 1, n1 = Math.floor((box.right - vw / 2) / SIZE) + 1;
      const room = bottom - Math.floor((box.bottom - vh / 2) / SIZE) - 1;

      const paint = (unit) => {
        const m = new Map();
        let under = 0;                                        // tallest thing drawn beneath the name
        const put = (i, level, colour) => {
          m.set(`${c0 + i},${bottom - level + 1}`, colour);
          if (level > under && c0 + i >= n0 && c0 + i <= n1) under = level;
        };

        // A gold sun in open sky, clear above whichever range is tallest beneath it.
        const sr = Math.max(3, unit * 0.09);
        const sx = Math.round(sunAcross * cols) + 0.5;
        const sy = Math.max(...ranges.map((range) => ridge(range, Math.floor(sx), cols, unit).h)) + sr * 1.7;
        for (let i = Math.floor(sx - sr); i <= sx + sr; i++) {
          for (let level = Math.floor(sy - sr); level <= sy + sr + 1; level++) {
            if (i >= 0 && i < cols && level >= 1 && Math.hypot(i + 0.5 - sx, level - 0.5 - sy) <= sr) put(i, level, GOLD);
          }
        }
        for (const range of ranges) {
          for (let i = 0; i < cols; i++) {
            const { h, top } = ridge(range, i, cols, unit);
            // Snow covers the top fifth of the big peaks, with a ragged lower edge.
            const snowLine = top - Math.max(2, top * 0.22) + (i % 2 ? 0 : 1);
            for (let level = 1; level <= Math.round(h); level++) {
              put(i, level, range.snow && top > 0.27 * unit && level > snowLine ? SKY : range.c);
            }
          }
        }
        // Rolling green foothills in front.
        for (let i = 0; i < cols; i++) {
          const u = i / cols;
          const h = unit * (0.055 + 0.025 * Math.sin(u * 9 + hillA) + 0.015 * Math.sin(u * 23 + hillB));
          for (let level = 1; level <= Math.round(h); level++) put(i, level, SAGE);
        }
        return { m, under };
      };

      // Heights follow the window's width, but on a tall narrow screen they grow so the range still has presence.
      const unit = Math.min(rows, Math.max(cols * 0.62, rows * 0.55));
      let scene = paint(unit);
      // If a peak or the sun would reach the name, draw the whole scene smaller so it stops just short.
      if (!nameEl.hidden && room > 4 && scene.under > room) scene = paint(unit * room / scene.under);
      return scene.m;
    }

    // Tiled floors. Each answers one question: what colour is the square at column x,
    // row y (or -1 for bare paper)? The pattern repeats across the whole window, and a
    // plain panel with a border is left around the name so it stays readable.
    const mod = (n, m) => ((n % m) + m) % m;
    // Squares out from the centre of a tile T wide: 0 at the middle pair, T/2 - 1 at the edge.
    const out = (v, T) => { const t = mod(v, T), h = T / 2; return t < h ? h - 1 - t : t - h; };
    const FLOORS = {
      // Zigzag bands running across.
      chevron: { border: INDIGO, at(x, y) {
        const band = mod(y + Math.abs(mod(x, 8) - 4), 6);
        return band < 2 ? BLUE : band < 4 ? SKY : -1;
      } },
      // Blocks of planks, alternately lying across and standing up.
      basketweave: { border: SLATE, at(x, y) {
        const across = (Math.floor(mod(x, 8) / 4) + Math.floor(mod(y, 8) / 4)) % 2 === 0;
        if (across) return mod(y, 4) % 2 === 0 ? SAGE : -1;
        return mod(x, 4) % 2 === 0 ? SLATE : -1;
      } },
      // Concentric stepped diamonds with a gold centre.
      diamonds: { border: GOLD, at(x, y) {
        const steps = out(x, 12) + out(y, 12);
        if (steps <= 1) return GOLD;
        return [INDIGO, BLUE, SKY][Math.floor(steps / 2) % 3];
      } },
    };
    function tiledFloor(kind) {
      const floor = FLOORS[kind];
      const m = new Map();
      const c0 = Math.floor(-(vw / 2) / SIZE), c1 = Math.ceil((vw / 2) / SIZE) - 1;
      const r0 = Math.floor(-(vh / 2) / SIZE), r1 = Math.ceil((vh / 2) / SIZE) - 1;
      // The panel around the name: one blank square of margin, then a one-square border.
      // With the name switched off there is no panel and the pattern runs unbroken.
      const named = !document.querySelector('main').hidden;
      const box = document.querySelector('main').getBoundingClientRect();
      const pc0 = Math.floor((box.left - vw / 2) / SIZE) - 2, pc1 = Math.floor((box.right - vw / 2) / SIZE) + 2;
      const pr0 = Math.floor((box.top - vh / 2) / SIZE) - 2, pr1 = Math.floor((box.bottom - vh / 2) / SIZE) + 2;
      for (let row = r0; row <= r1; row++) {
        for (let col = c0; col <= c1; col++) {
          let colour;
          if (named && col >= pc0 && col <= pc1 && row >= pr0 && row <= pr1) {
            colour = col === pc0 || col === pc1 || row === pr0 || row === pr1 ? floor.border : -1;
          } else {
            colour = floor.at(col, row);
          }
          if (colour >= 0) m.set(`${col},${row}`, colour);
        }
      }
      return m;
    }
    // A map of the world filling the whole window: land in green, sea in blue. The
    // outline is stored as a grid 256 squares wide and 128 tall, pole to pole, each row
    // run-length encoded ("12.3x" is twelve squares of sea then three of land). From
    // Natural Earth, which is in the public domain.
    const WORLD_W = 256, WORLD_H = 128;
    const WORLD = '256./256./256./256./100.10x146./63.21x.5x.22x143./60.59x23.x.x17.2x30.4x58./53.x6.6x.10x3.35x21.11x47.5x.x55./48.x4.4x.3x.12x2.38x23.4x2.2x54.4x53./41.6x3.x4.3x.2x.x2.7x6.37x24.x32.4x22.10x48./45.8x4.x2.x.9x15.28x54.5x17.19x17.5x2.2x21./39.7x6.x3.3x.3x2.x3.x.2x15.25x54.2x17.22x.3x4.2x10.2x26./39.14x2.4x.x3.10x15.23x53.3x9.3x.x.37x7.7x22./x13.5x21.2x2.10x5.3x2.14x12.23x32.4x16.3x8.3x.61x15./12.17x3.11x2.11x2.5x4.4x.8x9.22x30.11x19.3x2.72x.6x./2x8.37x4.4x3.x.5x2.3x3.x.7x8.18x31.17x4.x3.16x.75x/6x5.59x3.x2.8x6.14x34.19x2.97x/.6x2.32x.26x5.7x2.x7.11x10.7x18.8x2.7x3.100x/13.52x.5x2.x2.6x9.8x14.4x18.8x.111x./11.52x10.x.x2.4x10.6x34.9x2.112x./10.51x11.6x15.5x33.9x3.7x.89x.2x.7x5./9.x.8x.2x4.35x12.6x17.x35.9x3.94x4.5x9./14.x.3x11.32x11.10x41.x7.2x2.4x5.83x13.2x13./15.2x.x14.32x8.11x40.2x8.2x.3x3.84x12.5x12./12.3x19.35x4.12x39.3x7.x.2x5.82x13.5x13./35.35x2.16x33.3x2.2x6.71x.20x.x11.3x14./36.22x.11x2.17x32.2x2.4x2.99x9.2x15./37.51x36.5x.98x.x9.x16./37.44x.3x2.x40.100x.2x25./39.x.24x.16x4.4x35.103x.x26./40.25x3.14x7.2x35.101x2.x26./40.29x.15x42.22x2.3x.7x3.61x30./40.29x.10x.2x44.10x2.10x6.6x3.61x3.3x25./39.39x43.9x2.x3.2x2.8x9.5x3.58x4.4x25./39.39x44.8x7.3x2.6x2.5x2.6x4.53x7.2x27./40.36x45.7x6.x4.2x.2x3.16x3.47x2.4x8.2x27./40.35x46.7x11.x3.2x2.16x3.46x5.2x8.2x27./41.33x48.5x5.3x2.2x4.2x2.17x2.49x3.2x6.2x28./42.32x49.2x2.9x15.x.61x4.2x3.5x28./42.31x50.13x15.x.60x5.x2.6x29./44.28x50.16x5.x9.61x6.3x33./45.25x51.18x3.5x2.x2.63x5.x35./45.2x.22x51.94x41./48.12x9.2x49.42x2.51x41./46.2x.10x10.2x48.33x.10x2.49x42./48.x.9x11.x47.34x2.10x5.44x43./48.x2.8x58.36x.11x2.x8.36x2.x41./49.x2.7x10.2x45.37x2.15x7.34x2.x42./53.6x6.x4.3x43.38x2.14x7.15x.15x48./53.6x4.3x7.2x41.39x.13x11.10x4.10x2.x49./54.6x3.3x10.3x37.39x2.12x11.8x7.8x2.2x49./56.9x8.x42.40x2.10x12.7x8.9x9.2x41./58.7x2.x48.40x2.7x15.6x9.x.8x8.2x41./62.7x47.41x.6x17.4x12.9x8.x41./64.5x47.42x.3x19.4x13.8x8.2x40./66.3x7.2x38.43x22.4x13.x2.5x8.x41./67.2x5.7x.x34.47x18.3x13.x3.3x10.2x39./68.5x.11x33.46x18.2x.x12.x3.x14.x38./70.x.14x33.45x20.2x12.2x15.3x38./73.14x33.43x22.x13.2x10.x4.2x38./73.18x30.6x5.30x34.2x.3x7.4x43./73.19x43.27x35.2x.2x7.3x44./72.20x43.26x37.4x5.5x44./71.21x42.25x39.3x4.7x4.x.2x36./71.24x39.17x.6x41.3x4.6x.x7.2x33./70.26x39.22x43.3x3.5x2.2x7.2x.2x29./71.30x35.21x44.3x4.2x3.2x4.2x.9x25./70.33x33.20x46.2x9.x.x9.7x4.x19./71.32x34.19x47.2x21.7x.x3.x17./71.32x34.19x48.6x16.7x23./72.31x34.19x55.x.2x.2x10.2x2.2x22./72.30x35.20x77.x21./73.28x36.20x64.4x4.x26./73.28x36.20x5.2x56.5x3.2x26./74.27x35.21x5.2x53.8x3.3x25./75.25x36.20x4.4x52.10x2.4x23.x/77.23x36.19x4.4x52.17x22.x./78.22x37.17x5.4x51.18x24./78.21x38.16x6.4x48.23x22./78.21x39.15x6.3x48.24x12.x9./78.20x40.15x6.3x47.26x21./78.17x43.15x6.3x47.27x20./77.17x44.13x58.28x19./77.17x45.12x58.28x19./77.16x47.11x58.28x19./77.15x48.10x60.27x19./77.14x50.8x61.27x19./77.14x50.7x62.7x7.12x20./77.13x51.2x67.3x11.x.10x20./76.12x139.8x16.x4./76.11x140.8x17.x3./76.10x143.x.x20.3x./75.9x168.2x2./75.7x149.3x16.2x4./75.8x148.2x16.2x5./75.7x165.3x6./75.5x166.3x7./75.6x175./74.7x175./74.6x97.x78./74.5x6.2x169./75.4x177./76.5x175./78.2x176./256./256./256./256./256./84.x.x169./82.2x172./80.3x80.6x20.3x7.13x2.18x24./80.2x76.19x7.50x22./77.6x57.2x8.27x4.60x15./75.9x39.x2.x2.48x2.70x7./56.3x16.4x.5x34.130x7./44.x.x8.30x32.131x8./24.58x32.131x11./22.56x29.138x11./12.x3.59x18.3x7.143x10./13.x4.55x19.5x6.141x12./17.3x2.57x2.4x5.5x7.140x14./19.67x3.156x11./6.x12.231x6./21x3.232x/256x/256x/256x';
    let worldRows = null;
    function worldMap() {
      if (!worldRows) worldRows = WORLD.split('/').map((row) => row.replace(/(\d*)([.x])/g, (_, n, k) => k.repeat(n ? +n : 1)));
      const m = new Map();
      const c0 = Math.floor(-(vw / 2) / SIZE), c1 = Math.ceil((vw / 2) / SIZE) - 1;
      const r0 = Math.floor(-(vh / 2) / SIZE), r1 = Math.ceil((vh / 2) / SIZE) - 1;
      const cols = c1 - c0 + 1, rows = r1 - r0 + 1;
      // Squares per degree each way. The map is stretched to the window's shape, but by no
      // more than 1.3 times; past that it keeps its shape and the overflow is cropped,
      // so a tall phone screen shows the middle of the map (Europe and Africa).
      let sx = cols / 360, sy = rows / 180;
      if (sy > sx * 1.3) sx = sy / 1.3;
      if (sx > sy * 1.3) sy = sx / 1.3;
      const CENTRE_LON = 10;
      const landAt = (lon, lat) => {
        const x = Math.floor(((((lon + 180) % 360) + 360) % 360) / 360 * WORLD_W);
        const y = Math.min(WORLD_H - 1, Math.max(0, Math.floor((90 - lat) / 180 * WORLD_H)));
        return worldRows[y][x] === 'x';
      };
      for (let j = 0; j < rows; j++) {
        for (let i = 0; i < cols; i++) {
          // Land if most of a 3 by 3 spread of points inside the square are on land.
          let land = 0;
          for (let a = 1; a <= 5; a += 2) {
            for (let b = 1; b <= 5; b += 2) {
              const lon = CENTRE_LON + (i + a / 6 - cols / 2) / sx, lat = -(j + b / 6 - rows / 2) / sy;
              if (lat <= 90 && lat >= -90 && landAt(lon, lat)) land++;
            }
          }
          m.set(`${c0 + i},${r0 + j}`, land >= 5 ? SAGE : BLUE);
        }
      }
      return m;
    }
    // Every kind of scene takes a seed; the floors and maps are fixed designs and ignore it.
    const SCENES = {
      mountains: landscape,
      chevron: () => tiledFloor('chevron'),
      basketweave: () => tiledFloor('basketweave'),
      diamonds: () => tiledFloor('diamonds'),
      world: worldMap,
    };
    const SCENE_ORDER = ['mountains', 'chevron', 'basketweave', 'diamonds', 'world'];

    // What is remembered: which scene was generated (its kind and seed, or none for blank paper)
    // and the visitor's own changes on top of it, square -> colour, or -1 for rubbed out.
    let cells = new Map();
    let scene = null;
    let edits = new Map();
    try {
      const saved = JSON.parse(localStorage.getItem(STORE) || 'null');
      if (saved) {
        scene = saved.scene ?? null;
        if (typeof scene === 'number') scene = { type: 'mountains', seed: scene };   // saved before there were kinds
        if (scene && !SCENES[scene.type]) scene = null;
        edits = new Map(Object.entries(saved.edits || {}));
      }
    } catch {}
    const compose = () => {
      cells = scene === null ? new Map() : SCENES[scene.type](scene.seed);
      for (const [key, c] of edits) { if (c < 0) cells.delete(key); else cells.set(key, c); }
    };
    const save = () => {
      try { localStorage.setItem(STORE, JSON.stringify({ scene, edits: Object.fromEntries(edits) })); } catch {}
    };

    let vw = 0, vh = 0, dpr = 1, hover = null;
    let dotColor = '', hoverColor = '';
    const originX = () => vw / 2;
    const cellAt = (x, y) => [Math.floor((x - originX()) / SIZE), Math.floor((y - vh / 2) / SIZE)];

    function draw() {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const ox = originX(), oy = vh / 2;
      // Snap to device pixels so dots and squares stay crisp.
      const px = (v) => Math.round(v * dpr);

      // A square is filled inside its cell, leaving GAP of paper on every side.
      const fill = (col, row) => {
        const x0 = px(ox + col * SIZE + GAP), y0 = px(oy + row * SIZE + GAP);
        const x1 = px(ox + (col + 1) * SIZE - GAP) + 1, y1 = px(oy + (row + 1) * SIZE - GAP) + 1;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(x0, y0, x1 - x0, y1 - y0, (SIZE / 12) * dpr); else ctx.rect(x0, y0, x1 - x0, y1 - y0);
        ctx.fill();
      };
      for (const [key, c] of cells) {
        const [col, row] = key.split(',').map(Number);
        ctx.fillStyle = COLORS[c];
        fill(col, row);
      }
      if (hover) {
        ctx.fillStyle = hoverColor;
        fill(hover[0], hover[1]);
      }

      // A dot at every corner where grid lines would cross.
      ctx.fillStyle = dotColor;
      const r = Math.max(1, (SIZE < 12 ? 0.8 : 1.1) * dpr);
      ctx.beginPath();
      for (let j = Math.floor(-oy / SIZE); oy + j * SIZE <= vh; j++) {
        for (let k = Math.floor(-ox / SIZE); ox + k * SIZE <= vw; k++) {
          const x = px(ox + k * SIZE) + 0.5, y = px(oy + j * SIZE) + 0.5;
          ctx.moveTo(x + r, y);
          ctx.arc(x, y, r, 0, 6.2832);
        }
      }
      ctx.fill();
    }

    function resize() {
      vw = innerWidth; vh = innerHeight;
      SIZE = vw < 600 ? 12 : 18;
      GAP = SIZE >= 14 ? 2 : 1;
      compose();
      dpr = Math.min(3, devicePixelRatio || 1);
      canvas.width = Math.round(vw * dpr);
      canvas.height = Math.round(vh * dpr);
      draw();
    }
    addEventListener('resize', resize);

    // Light and dark. With no saved choice the system setting decides.
    const root = document.documentElement;
    const themeBtn = document.getElementById('theme');
    const resetBtn = document.getElementById('reset');
    const savedTheme = () => {
      try { const t = localStorage.getItem('paper-theme'); return t === 'light' || t === 'dark' ? t : null; } catch { return null; }
    };
    function applyTheme() {
      const t = savedTheme();
      if (t) root.dataset.theme = t; else delete root.dataset.theme;
      themeBtn.textContent = 'Theme: ' + (t || 'system');
      const css = getComputedStyle(root);
      dotColor = css.getPropertyValue('--dot').trim();
      hoverColor = css.getPropertyValue('--hover').trim();
      document.querySelector('meta[name="theme-color"]').content = css.getPropertyValue('--bg').trim();
      draw();
    }
    themeBtn.addEventListener('click', () => {
      const next = { system: 'light', light: 'dark', dark: 'system' }[savedTheme() || 'system'];
      try { if (next === 'system') localStorage.removeItem('paper-theme'); else localStorage.setItem('paper-theme', next); } catch {}
      applyTheme();
    });
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

    // The Name button takes the name and link off the page, leaving just the paper, and puts them back.
    const nameBtn = document.getElementById('name');
    const mainEl = document.querySelector('main');
    function applyName(on) {
      mainEl.hidden = !on;
      nameBtn.textContent = 'Name: ' + (on ? 'on' : 'off');
      nameBtn.setAttribute('aria-pressed', String(on));
    }
    try { applyName(localStorage.getItem('paper-name') !== 'off'); } catch { applyName(true); }
    nameBtn.addEventListener('click', () => {
      const on = mainEl.hidden;
      applyName(on);
      try { if (on) localStorage.removeItem('paper-name'); else localStorage.setItem('paper-name', 'off'); } catch {}
      compose();   // a floor's panel comes and goes with the name
      draw();
    });

    // The three dots unfold the rest of the buttons, and fold them away again.
    const menuBtn = document.getElementById('menu'), more = document.getElementById('more');
    menuBtn.addEventListener('click', () => {
      const open = more.hidden;
      more.hidden = !open;
      menuBtn.setAttribute('aria-expanded', String(open));
      menuBtn.setAttribute('aria-label', open ? 'Hide the extra buttons' : 'Show all buttons');
    });

    const changed = () => { resetBtn.disabled = scene === null && edits.size === 0; };
    resetBtn.addEventListener('click', () => {
      scene = null;
      edits.clear();
      try { localStorage.removeItem(STORE); } catch {}
      compose();
      changed(); draw();
    });
    // Random replaces whatever is on the paper with a freshly generated scene.
    document.getElementById('random').addEventListener('click', () => {
      // Take turns: the kind after the one showing now, starting with mountains.
      const next = SCENE_ORDER[(SCENE_ORDER.indexOf(scene ? scene.type : null) + 1) % SCENE_ORDER.length];
      scene = { type: next, seed: (Math.random() * 4294967296) >>> 0 };
      edits.clear();
      save();
      compose();
      changed(); draw();
    });

    resize();
    applyTheme();
    changed();
    // The name's width changes when the web font arrives, and a floor's panel is fitted to it.
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { compose(); draw(); });

    // Press a square to move it to its next colour (or back to blank after the
    // last). Keep the button or finger down and drag: each blank square you enter
    // takes the stroke's colour, and each coloured square you enter, including one
    // this stroke already painted, is bumped to the next colour in the sequence.
    const bump = (key) => {
      const next = cells.has(key) ? cells.get(key) + 1 : 0;
      const value = next >= COLORS.length ? -1 : next;
      if (value < 0) cells.delete(key); else cells.set(key, value);
      edits.set(key, value);
      return value;
    };
    let brush = null, curKey = '', lastX = 0, lastY = 0;
    addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || !e.isPrimary) return;
      if (e.target.closest && e.target.closest('a, button')) return;  // links and buttons keep working
      curKey = cellAt(e.clientX, e.clientY).join(',');
      brush = bump(curKey);
      lastX = e.clientX; lastY = e.clientY;
      changed();
      draw();
    });
    addEventListener('pointermove', (e) => {
      let dirty = false;
      if (brush !== null && e.isPrimary) {
        // Step along the path in half-square hops, so a fast drag leaves no holes.
        const n = Math.max(1, Math.ceil(Math.hypot(e.clientX - lastX, e.clientY - lastY) / (SIZE / 2)));
        for (let s = 1; s <= n; s++) {
          const key = cellAt(lastX + (e.clientX - lastX) * s / n, lastY + (e.clientY - lastY) * s / n).join(',');
          if (key === curKey) continue;   // still inside the same square
          curKey = key;
          if (cells.has(key)) bump(key);
          else if (brush >= 0) { cells.set(key, brush); edits.set(key, brush); }
          else continue;
          dirty = true;
        }
        lastX = e.clientX; lastY = e.clientY;
        if (dirty) changed();
      }
      // A faint highlight on the square under the mouse.
      if (e.pointerType === 'mouse') {
        const c = cellAt(e.clientX, e.clientY);
        if (!hover || hover[0] !== c[0] || hover[1] !== c[1]) { hover = c; dirty = true; }
      }
      if (dirty) draw();
    }, { passive: true });
    const lift = () => { if (brush !== null) { brush = null; save(); } };
    addEventListener('pointerup', lift);
    addEventListener('pointercancel', lift);
    addEventListener('blur', lift);
    document.addEventListener('mouseleave', () => { hover = null; draw(); });
  })();
  </script>
