<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tucker Severson</title>
  <meta name="description" content="Tucker Severson">
  <meta name="theme-color" content="#f6f8fb">
  <script>
    // Apply a saved light/dark choice before the first paint; with none saved, the system setting decides.
    try {
      var t = localStorage.getItem('paper-theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="canonical" href="https://tuckerseverson.com/">
  <link rel="me" href="https://www.linkedin.com/in/tuckerseverson/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      --bg: #f6f8fb;
      --fg: #1d1f2b; --muted: #5a5f78;
      --dot: rgba(52, 66, 120, 0.15);
      /* Tuned in the Paper Gradient Lab: a blue glow in the bottom right, a trace of purple on the left and of grey along the top. */
      --glow:
        radial-gradient(ellipse 75% 75% at 88% 86%, rgba(127, 168, 245, 0.125) 0%, rgba(127, 168, 245, 0.105) 25%, rgba(127, 168, 245, 0.062) 50%, rgba(127, 168, 245, 0.02) 75%, rgba(127, 168, 245, 0) 100%),
        radial-gradient(ellipse 60% 60% at 8% 62%, rgba(166, 139, 232, 0.05) 0%, rgba(166, 139, 232, 0.042) 25%, rgba(166, 139, 232, 0.025) 50%, rgba(166, 139, 232, 0.008) 75%, rgba(166, 139, 232, 0) 100%),
        radial-gradient(ellipse 70% 70% at 62% -5%, rgba(154, 163, 184, 0.05) 0%, rgba(154, 163, 184, 0.042) 25%, rgba(154, 163, 184, 0.025) 50%, rgba(154, 163, 184, 0.008) 75%, rgba(154, 163, 184, 0) 100%);
      --hover: rgba(40, 50, 95, 0.07);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #14161f;
        --fg: #e8eaf2; --muted: #9aa1b8;
        --dot: rgba(160, 176, 230, 0.17);
        --glow:
        radial-gradient(ellipse 75% 75% at 88% 86%, rgba(127, 168, 245, 0.056) 0%, rgba(127, 168, 245, 0.047) 25%, rgba(127, 168, 245, 0.028) 50%, rgba(127, 168, 245, 0.009) 75%, rgba(127, 168, 245, 0) 100%),
        radial-gradient(ellipse 60% 60% at 8% 62%, rgba(166, 139, 232, 0.023) 0%, rgba(166, 139, 232, 0.019) 25%, rgba(166, 139, 232, 0.011) 50%, rgba(166, 139, 232, 0.004) 75%, rgba(166, 139, 232, 0) 100%),
        radial-gradient(ellipse 70% 70% at 62% -5%, rgba(154, 163, 184, 0.023) 0%, rgba(154, 163, 184, 0.019) 25%, rgba(154, 163, 184, 0.011) 50%, rgba(154, 163, 184, 0.004) 75%, rgba(154, 163, 184, 0) 100%);
        --hover: rgba(255, 255, 255, 0.07);
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #14161f;
      --fg: #e8eaf2; --muted: #9aa1b8;
      --dot: rgba(160, 176, 230, 0.17);
      --glow:
        radial-gradient(ellipse 75% 75% at 88% 86%, rgba(127, 168, 245, 0.056) 0%, rgba(127, 168, 245, 0.047) 25%, rgba(127, 168, 245, 0.028) 50%, rgba(127, 168, 245, 0.009) 75%, rgba(127, 168, 245, 0) 100%),
        radial-gradient(ellipse 60% 60% at 8% 62%, rgba(166, 139, 232, 0.023) 0%, rgba(166, 139, 232, 0.019) 25%, rgba(166, 139, 232, 0.011) 50%, rgba(166, 139, 232, 0.004) 75%, rgba(166, 139, 232, 0) 100%),
        radial-gradient(ellipse 70% 70% at 62% -5%, rgba(154, 163, 184, 0.023) 0%, rgba(154, 163, 184, 0.019) 25%, rgba(154, 163, 184, 0.011) 50%, rgba(154, 163, 184, 0.004) 75%, rgba(154, 163, 184, 0) 100%);
      --hover: rgba(255, 255, 255, 0.07);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
      /* Paper with soft glows of blue, purple and grey laid over it. */
      background: var(--glow), var(--bg);
      background-attachment: fixed;
      color: var(--fg);
      font-family: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      -webkit-font-smoothing: antialiased;
      touch-action: pinch-zoom;  /* a finger drag draws instead of scrolling */
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    #paper {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    main {
      position: relative;
      text-align: center;
      user-select: none;
      -webkit-user-select: none;
    }
    h1 {
      margin: 0 0 12px;
      font-size: clamp(1.5rem, 5.6vw, 2.75rem);
      font-weight: 500;
    }
    a {
      color: var(--muted);
      font-size: 1rem;
      text-decoration: underline;
      text-decoration-thickness: 1px;
      text-underline-offset: 4px;
      transition: color 120ms ease;
    }
    a:hover, a:focus-visible { color: var(--fg); }
    a:focus-visible { outline: 2px solid currentColor; outline-offset: 4px; border-radius: 2px; }
    .tools {
      position: fixed;
      right: max(12px, env(safe-area-inset-right, 0px));
      bottom: max(12px, env(safe-area-inset-bottom, 0px));
      display: flex;
      gap: 4px;
    }
    .tools button {
      font: inherit;
      font-size: 0.8125rem;
      color: var(--muted);
      background: none;
      border: 0;
      border-radius: 4px;
      padding: 8px 10px;
      cursor: pointer;
      transition: color 120ms ease;
    }
    .tools button:hover, .tools button:focus-visible { color: var(--fg); }
    .tools button:focus-visible { outline: 2px solid currentColor; outline-offset: -2px; }
    .tools button:disabled { opacity: 0.45; cursor: default; color: var(--muted); }
  </style>
</head>
<body>
  <canvas id="paper" aria-hidden="true"></canvas>
  <main>
    <h1>Tucker Severson</h1>
    <a href="https://www.linkedin.com/in/tuckerseverson/" rel="me noopener">LinkedIn</a>
  </main>
  <div class="tools">
    <button type="button" id="reset">Reset</button>
    <button type="button" id="theme">Theme: system</button>
  </div>
  <script>
  (() => {
    const canvas = document.getElementById('paper');
    const ctx = canvas.getContext('2d');
    if (!ctx) return;

    // Dot grid paper. Click a square to colour it, or drag to colour a run; each further click moves it to
    // the next colour in the sequence, and after the last one it goes back to blank.
    const SIZE = 18;   // px per square
    const GAP = 2;     // px of paper left around a coloured square
    const COLORS = ['#6a94e6', '#7cc4ee', '#5b62c9', '#9d82dc', '#cf8fcb', '#a3a9bb', '#565d7e'];
    //              blue       sky        indigo     purple     mauve      grey       slate
    const STORE = 'paper-cells-v2';

    // Squares are counted from the centre of the window, so a drawing stays put
    // around the name when the window is resized. Key "col,row" -> index into COLORS.
    let cells = new Map();
    try {
      const saved = localStorage.getItem(STORE);
      if (saved) {
        cells = new Map(Object.entries(JSON.parse(saved)));
      } else {
        // Drawings from when there were three colours: keep each square the colour it was.
        const old = { 0: 0, 1: 3, 2: 5 };
        const v1 = JSON.parse(localStorage.getItem('paper-cells-v1') || '{}');
        cells = new Map(Object.entries(v1).filter(([, c]) => c in old).map(([k, c]) => [k, old[c]]));
      }
    } catch {}
    const save = () => {
      try { localStorage.setItem(STORE, JSON.stringify(Object.fromEntries(cells))); } catch {}
    };

    let vw = 0, vh = 0, dpr = 1, hover = null;
    let dotColor = '', hoverColor = '';
    const cellAt = (x, y) => [Math.floor((x - vw / 2) / SIZE), Math.floor((y - vh / 2) / SIZE)];

    function draw() {
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const ox = vw / 2, oy = vh / 2;
      // Snap to device pixels so dots and squares stay crisp.
      const px = (v) => Math.round(v * dpr);

      // A square is filled inside its cell, leaving GAP of paper on every side.
      const fill = (col, row) => {
        const x0 = px(ox + col * SIZE + GAP), y0 = px(oy + row * SIZE + GAP);
        const x1 = px(ox + (col + 1) * SIZE - GAP) + 1, y1 = px(oy + (row + 1) * SIZE - GAP) + 1;
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(x0, y0, x1 - x0, y1 - y0, 1.5 * dpr); else ctx.rect(x0, y0, x1 - x0, y1 - y0);
        ctx.fill();
      };
      for (const [key, c] of cells) {
        const [col, row] = key.split(',').map(Number);
        ctx.fillStyle = COLORS[c];
        fill(col, row);
      }
      if (hover) {
        ctx.fillStyle = hoverColor;
        fill(hover[0], hover[1]);
      }

      // A dot at every corner where grid lines would cross.
      ctx.fillStyle = dotColor;
      const r = Math.max(1, 1.1 * dpr);
      ctx.beginPath();
      for (let j = Math.floor(-oy / SIZE); oy + j * SIZE <= vh; j++) {
        for (let k = Math.floor(-ox / SIZE); ox + k * SIZE <= vw; k++) {
          const x = px(ox + k * SIZE) + 0.5, y = px(oy + j * SIZE) + 0.5;
          ctx.moveTo(x + r, y);
          ctx.arc(x, y, r, 0, 6.2832);
        }
      }
      ctx.fill();
    }

    function resize() {
      vw = innerWidth; vh = innerHeight;
      dpr = Math.min(3, devicePixelRatio || 1);
      canvas.width = Math.round(vw * dpr);
      canvas.height = Math.round(vh * dpr);
      draw();
    }
    addEventListener('resize', resize);

    // Light and dark. With no saved choice the system setting decides.
    const root = document.documentElement;
    const themeBtn = document.getElementById('theme');
    const resetBtn = document.getElementById('reset');
    const savedTheme = () => {
      try { const t = localStorage.getItem('paper-theme'); return t === 'light' || t === 'dark' ? t : null; } catch { return null; }
    };
    function applyTheme() {
      const t = savedTheme();
      if (t) root.dataset.theme = t; else delete root.dataset.theme;
      themeBtn.textContent = 'Theme: ' + (t || 'system');
      const css = getComputedStyle(root);
      dotColor = css.getPropertyValue('--dot').trim();
      hoverColor = css.getPropertyValue('--hover').trim();
      document.querySelector('meta[name="theme-color"]').content = css.getPropertyValue('--bg').trim();
      draw();
    }
    themeBtn.addEventListener('click', () => {
      const next = { system: 'light', light: 'dark', dark: 'system' }[savedTheme() || 'system'];
      try { if (next === 'system') localStorage.removeItem('paper-theme'); else localStorage.setItem('paper-theme', next); } catch {}
      applyTheme();
    });
    matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

    const changed = () => { resetBtn.disabled = cells.size === 0; };
    resetBtn.addEventListener('click', () => { cells.clear(); save(); changed(); draw(); });

    resize();
    applyTheme();
    changed();

    // Press a square to move it to its next colour (or back to blank after the
    // last). Keep the button or finger down and drag: each blank square you enter
    // takes the stroke's colour, and each coloured square you enter, including one
    // this stroke already painted, is bumped to the next colour in the sequence.
    const bump = (key) => {
      const next = cells.has(key) ? cells.get(key) + 1 : 0;
      if (next >= COLORS.length) cells.delete(key); else cells.set(key, next);
      return next >= COLORS.length ? -1 : next;
    };
    let brush = null, curKey = '', lastX = 0, lastY = 0;
    addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || !e.isPrimary) return;
      if (e.target.closest && e.target.closest('a, button')) return;  // links and buttons keep working
      curKey = cellAt(e.clientX, e.clientY).join(',');
      brush = bump(curKey);
      lastX = e.clientX; lastY = e.clientY;
      changed();
      draw();
    });
    addEventListener('pointermove', (e) => {
      let dirty = false;
      if (brush !== null && e.isPrimary) {
        // Step along the path in half-square hops, so a fast drag leaves no holes.
        const n = Math.max(1, Math.ceil(Math.hypot(e.clientX - lastX, e.clientY - lastY) / (SIZE / 2)));
        for (let s = 1; s <= n; s++) {
          const key = cellAt(lastX + (e.clientX - lastX) * s / n, lastY + (e.clientY - lastY) * s / n).join(',');
          if (key === curKey) continue;   // still inside the same square
          curKey = key;
          if (cells.has(key)) bump(key);
          else if (brush >= 0) cells.set(key, brush);
          else continue;
          dirty = true;
        }
        lastX = e.clientX; lastY = e.clientY;
        if (dirty) changed();
      }
      // A faint highlight on the square under the mouse.
      if (e.pointerType === 'mouse') {
        const c = cellAt(e.clientX, e.clientY);
        if (!hover || hover[0] !== c[0] || hover[1] !== c[1]) { hover = c; dirty = true; }
      }
      if (dirty) draw();
    }, { passive: true });
    const lift = () => { if (brush !== null) { brush = null; save(); } };
    addEventListener('pointerup', lift);
    addEventListener('pointercancel', lift);
    addEventListener('blur', lift);
    document.addEventListener('mouseleave', () => { hover = null; draw(); });
  })();
  </script>
</body>
</html>
